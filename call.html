<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090812"><title>SDA Call</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 8%,#321b4d 0,transparent 45%),#090812;color:#f8f6fc;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}.call{width:min(100%,560px);text-align:center}.brand{font-size:11px;letter-spacing:.18em;font-weight:900;color:#c4a1ff}.avatar{width:104px;height:104px;border-radius:32px;margin:52px auto 22px;display:grid;place-items:center;background:linear-gradient(145deg,#693a9d,#2b1b40);border:1px solid #9867c4;font-size:36px;font-weight:900;box-shadow:0 0 0 8px #8b5cf622}.title{font-size:27px;font-weight:850;letter-spacing:-.04em}.status{margin-top:9px;color:#b8abc9;font-size:13px}.video{display:none;width:100%;aspect-ratio:4/5;max-height:55vh;object-fit:cover;border-radius:24px;background:#171321;margin:24px auto;border:1px solid #49345f}.remote{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:22px;background:#171321;margin-top:18px}.controls{display:flex;justify-content:center;gap:18px;margin:58px auto 20px}.btn{width:62px;height:62px;border:1px solid #59466d;border-radius:22px;background:#292333;color:white;font-size:23px}.btn.end{background:#d83e5b;border-color:#f36a7f}.btn:disabled{opacity:.45}.hint{font-size:11px;color:#82778f;margin-top:22px}#error{color:#fda4af;margin-top:20px;white-space:pre-wrap}
</style></head><body><main class="call"><div class="brand">SWORD DRILL ARENA · PRIVATE CALL</div><div class="avatar" id="avatar">SDA</div><div class="title" id="title">Connecting…</div><div class="status" id="status">Preparing secure call</div><video class="video" id="remoteVideo" autoplay playsinline></video><video class="video" id="localVideo" autoplay muted playsinline></video><div class="controls"><button class="btn" id="mic" aria-label="Mute microphone">🎙</button><button class="btn" id="camera" aria-label="Turn camera on">▣</button><button class="btn end" id="end" aria-label="End call">☎</button></div><div class="hint">Your call is private to the two SDA participants.</div><div id="error"></div></main>
<script type="module">
import {Room,RoomEvent,Track} from 'https://esm.sh/livekit-client@2.15.6';
const q=new URLSearchParams(location.hash.slice(1));const token=q.get('token'),serverUrl=q.get('serverUrl'),roomName=q.get('roomName'),callId=q.get('callId'),callType=q.get('callType')||'audio',api=q.get('api'),supabaseUrl=q.get('supabaseUrl'),anon=q.get('supabaseAnonKey');
const $=id=>document.getElementById(id);let room,micOn=true,cameraOn=false,finished=false;
$('title').textContent=q.get('title')||'SDA Call';$('camera').style.display=callType==='video'?'block':'none';
function fail(e){$('status').textContent='Could not connect';$('error').textContent=e?.message||String(e)}
function attach(track,local=false){const el=document.createElement(track.kind==='video'?'video':'audio');el.autoplay=true;el.playsInline=true;if(local)el.muted=true;track.attach(el);if(track.kind==='video'){el.className='remote';$(local?'localVideo':'remoteVideo').replaceWith(el);el.id=local?'localVideo':'remoteVideo';el.style.display='block'}else{el.className='sda-audio';document.body.append(el)}}
async function finish(){if(finished)return;finished=true;try{await fetch(supabaseUrl+'/functions/v1/sda-call-service',{method:'POST',headers:{'Content-Type':'application/json','apikey':anon,'Authorization':'Bearer '+api},body:JSON.stringify({action:'end',callId})})}catch{}room?.disconnect();window.ReactNativeWebView?.postMessage(JSON.stringify({type:'SDA_CALL_ENDED',callId}));$('status').textContent='Call ended';$('mic').disabled=true;$('camera').disabled=true;$('end').disabled=true;setTimeout(()=>{const m=JSON.stringify({type:'SDA_CALL_RETURN',callId});if(window.ReactNativeWebView?.postMessage)window.ReactNativeWebView.postMessage(m);else if(q.get('returnUrl'))location.href=q.get('returnUrl')},450)}
async function start(){if(!token||!serverUrl||!roomName||!callId||!api||!supabaseUrl||!anon)throw Error('The call link is incomplete. Return to SDA and try again.');room=new Room({adaptiveStream:true,dynacast:true});room.on(RoomEvent.TrackSubscribed,(track)=>attach(track));room.on(RoomEvent.LocalTrackPublished,p=>{if(p.track)attach(p.track,true)});room.on(RoomEvent.ParticipantConnected,()=>{$('status').textContent='Connected'});room.on(RoomEvent.ParticipantDisconnected,()=>{if(!finished){$('status').textContent='The other person left the call';finish()}});room.on(RoomEvent.Disconnected,()=>{if(!finished){finished=true;window.ReactNativeWebView?.postMessage(JSON.stringify({type:'SDA_CALL_ENDED',callId}));$('status').textContent='Call disconnected'}});await room.connect(serverUrl,token);window.ReactNativeWebView?.postMessage(JSON.stringify({type:'SDA_CALL_CONNECTED',callId}));await room.localParticipant.setMicrophoneEnabled(true);if(callType==='video'){$('status').textContent='Connected · turn on your camera when ready'}else $('status').textContent='Connected · waiting for the other person';$('mic').onclick=async()=>{micOn=!micOn;await room.localParticipant.setMicrophoneEnabled(micOn);$('mic').textContent=micOn?'🎙':'🔇'};$('camera').onclick=async()=>{cameraOn=!cameraOn;await room.localParticipant.setCameraEnabled(cameraOn);$('camera').textContent=cameraOn?'▣':'□'};$('end').onclick=finish;}
start().catch(fail);
</script></body></html>
